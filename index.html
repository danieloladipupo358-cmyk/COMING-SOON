<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="container">

        <div class="content">

            <p class="small-text">OUR WEBSITE IS</p>

            <h1>COMING SOON</h1>

            <p class="description">
                We are working hard to bring something amazing.
                Stay tuned and get ready!
            </p>

            <div class="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <p>Days</p>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <p>Hours</p>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <p>Minutes</p>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <p>Seconds</p>
                </div>

            </div>

            <form class="subscribe-form" id="subscribe-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit">
                    Notify Me
                </button>

            </form>

            <p id="message"></p>

        </div>

    </div>

    <script src="JS/script.js"></script>

</body>
</html>
